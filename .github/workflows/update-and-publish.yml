name: 情報漏洩チェック 自動更新・公開
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: information-leak-check-publish
  cancel-in-progress: false
jobs:
  update-and-build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: ソースを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: 監査済みの更新ソースがある場合に展開
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          archive=Path('update-source-1.3.2.zip')
          if archive.is_file():
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == 'b5011579209d1b96683cad9110d19c767338ae8e61dbe5205eb6b6ccb080f515'
              root=Path.cwd().resolve()
              with zipfile.ZipFile(archive) as z:
                  for entry in z.infolist():
                      target=(root/entry.filename).resolve()
                      assert target.is_relative_to(root) and '.git' not in Path(entry.filename).parts and '.github' not in Path(entry.filename).parts
                  z.extractall(root)
              archive.unlink()
          PY
      - name: Pythonを確認
        run: python3 --version
      - name: HTML解析ライブラリを用意
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt
      - name: 取りこぼし再発防止の検査
        run: python3 -m unittest discover -s scripts -p test_discovery.py -v
      - name: 公開情報の取得と変更確認
        run: python3 scripts/update_sources.py
      - name: 公開対象と機密情報の形式を確認
        run: python3 scripts/audit_public_files.py
      - name: 公開ファイルの整合性を確認
        run: python3 scripts/validate_site.py
      - name: 更新データを保存
        run: |
          git config user.name "information-leak-check updater"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data dist scripts README.md SECURITY.md requirements.txt .gitignore
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Update public source checks and announcements"
            git push
          fi
      - name: 静的ファイルを公開用にまとめる
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 1
  deploy:
    permissions:
      pages: write
      id-token: write
    needs: update-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pagesを構成
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

